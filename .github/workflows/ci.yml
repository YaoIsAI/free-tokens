name: CI

on:
  push:
    branches: [ main, public-main ]
  pull_request:
    branches: [ main, public-main ]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
      - run: npm ci
      - run: npm run ci
